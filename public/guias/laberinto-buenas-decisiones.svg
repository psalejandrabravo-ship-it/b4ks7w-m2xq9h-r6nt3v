<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297">
  <title>El laberinto de las buenas decisiones</title>
  <defs>
    <style>
      text { font-family: Nunito, "Liberation Sans", sans-serif; fill: #111; }
      .ink { fill: none; stroke: #111; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="210" height="297" fill="#fff"/>

  <text x="105" y="20" text-anchor="middle" font-size="6.2" font-weight="800">EL LABERINTO DE LAS BUENAS DECISIONES</text>
  <text x="18" y="28" font-size="4.2" font-weight="400">Nombre:</text>
  <line x1="40" y1="28.2" x2="128" y2="28.2" stroke="#111" stroke-width="0.35"/>
  <text x="134" y="28" font-size="4.2" font-weight="400">Fecha:</text>
  <line x1="152" y1="28.2" x2="192" y2="28.2" stroke="#111" stroke-width="0.35"/>

  <rect x="15" y="32" width="180" height="58" rx="4" class="ink" stroke-width="2"/>
  <text x="105" y="39.5" text-anchor="middle" font-size="4.5" font-weight="700">Lucas ve a su amigo Tomás jugando solo con bloques.</text>
  <text x="105" y="45" text-anchor="middle" font-size="4.5" font-weight="700">Le pregunta si puede jugar juntos, pero Tomás le dice que NO.</text>

  <!-- Lucas invita -->
  <g class="ink" stroke-width="1.35" transform="translate(52 84)">
    <path d="M-6.5 -29 Q0 -38 6.5 -29"/>
    <path d="M-3 -36 Q0 -40 3 -36"/>
    <circle cx="0" cy="-26" r="7.2"/>
    <circle cx="-2.6" cy="-27" r="0.9" fill="#111" stroke="none"/>
    <circle cx="2.6" cy="-27" r="0.9" fill="#111" stroke="none"/>
    <path d="M-2.6 -23.2 Q0 -20.8 2.6 -23.2"/>
    <path d="M-7.2 -26.2 Q-9.2 -25.2 -7.2 -23.6"/>
    <path d="M7.2 -26.2 Q9.2 -25.2 7.2 -23.6"/>
    <path d="M-5.2 -19.2 Q-7 -8 -5.2 -2 h10.4 Q7 -8 5.2 -19.2"/>
    <path d="M-5 -15 Q-16 -18 -22 -11"/>
    <path d="M5 -15 Q16 -18 22 -11"/>
    <circle cx="-22" cy="-11" r="1.7"/>
    <circle cx="22" cy="-11" r="1.7"/>
    <path d="M-2.4 -2 L-3.2 8"/>
    <path d="M2.4 -2 L3.2 8"/>
    <path d="M-5.4 8 h4.2"/>
    <path d="M1.2 8 h4.2"/>
  </g>

  <!-- Tomás sentado, dice no -->
  <g class="ink" stroke-width="1.35" transform="translate(148 84)">
    <rect x="-28" y="2" width="8" height="7" rx="0.6"/>
    <rect x="-18" y="-2" width="9" height="8" rx="0.6"/>
    <rect x="-8" y="3" width="7" height="6" rx="0.6"/>
    <rect x="6" y="1" width="8" height="8" rx="0.6"/>
    <rect x="16" y="4" width="7" height="5" rx="0.6"/>
    <path d="M-5 -27 Q0 -34 5 -27"/>
    <circle cx="0" cy="-23" r="6.4"/>
    <path d="M-3.2 -25.2 L-1.2 -23.6"/>
    <path d="M3.2 -25.2 L1.2 -23.6"/>
    <circle cx="-2.2" cy="-23.2" r="0.85" fill="#111" stroke="none"/>
    <circle cx="2.2" cy="-23.2" r="0.85" fill="#111" stroke="none"/>
    <path d="M-2.2 -20.4 H2.2"/>
    <path d="M-4.5 -16 Q-6 -8 -10 -2"/>
    <path d="M4.5 -16 Q8 -6 12 -2"/>
    <path d="M-10 -2 Q-2 2 12 -2"/>
    <path d="M-8 -1 L-14 6"/>
    <path d="M-2 -0.5 L2 7"/>
    <path d="M-16 6 h5"/>
    <path d="M0 7 h5"/>
    <path d="M6 -10 Q14 -24 12 -30"/>
    <circle cx="12" cy="-31.4" r="2.2"/>
  </g>

  <!-- Laberinto: bordes negros y camino blanco -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#111" stroke-width="20">
      <path d="M105 118 V130"/>
      <path d="M105 130 C72 140 40 152 56 166 C74 182 34 188 43 198"/>
      <path d="M105 130 C130 146 78 156 122 174 C148 186 78 192 105 200"/>
      <path d="M105 130 C138 140 170 152 154 166 C136 182 176 188 167 198"/>
    </g>
    <g stroke="#fff" stroke-width="14">
      <path d="M105 118 V130"/>
      <path d="M105 130 C72 140 40 152 56 166 C74 182 34 188 43 198"/>
      <path d="M105 130 C130 146 78 156 122 174 C148 186 78 192 105 200"/>
      <path d="M105 130 C138 140 170 152 154 166 C136 182 176 188 167 198"/>
    </g>
  </g>

  <g class="ink" stroke-width="1.15" transform="translate(105 106)">
    <circle cx="0" cy="-7" r="4.4"/>
    <path d="M-3.5 -9.2 Q0 -13.4 3.5 -9.2"/>
    <circle cx="-1.5" cy="-7.3" r="0.55" fill="#111" stroke="none"/>
    <circle cx="1.5" cy="-7.3" r="0.55" fill="#111" stroke="none"/>
    <path d="M-1.4 -5.4 Q0 -4.1 1.4 -5.4"/>
    <path d="M-2.5 -3 Q-3.4 1.4 -2.1 4.6"/>
    <path d="M2.5 -3 Q3.4 1.4 2.1 4.6"/>
  </g>
  <text x="105" y="114" text-anchor="middle" font-size="3.6" font-weight="800">LUCAS</text>

  <g font-size="6" font-weight="800" text-anchor="middle">
    <circle cx="60" cy="148" r="6.2" fill="#fff" stroke="#111" stroke-width="1.2"/>
    <text x="60" y="150.2">A</text>
    <circle cx="106" cy="152" r="6.2" fill="#fff" stroke="#111" stroke-width="1.2"/>
    <text x="106" y="154.2">B</text>
    <circle cx="150" cy="148" r="6.2" fill="#fff" stroke="#111" stroke-width="1.2"/>
    <text x="150" y="150.2">C</text>
  </g>

  <!-- Resultados -->
  <g>
    <rect x="15" y="214" width="56" height="66" rx="3.5" fill="#fff" stroke="#c0392b" stroke-width="2.4"/>
    <path d="M24 236 L62 274 M62 236 L24 274" fill="none" stroke="#c0392b" stroke-width="2.2" opacity="0.28"/>
    <text x="43" y="221" text-anchor="middle" font-size="4.2" font-weight="800">CAMINO A</text>
    <g class="ink" stroke-width="1.05" transform="translate(43 240)">
      <circle cx="0" cy="-16" r="4.2"/>
      <path d="M-2.2 -18.2 L-0.6 -16.8"/>
      <path d="M2.2 -18.2 L0.6 -16.8"/>
      <circle cx="-1.4" cy="-16.2" r="0.5" fill="#111" stroke="none"/>
      <circle cx="1.4" cy="-16.2" r="0.5" fill="#111" stroke="none"/>
      <path d="M-1.6 -13.8 Q0 -15.2 1.6 -13.8"/>
      <path d="M-3 -12 Q-4 -6 -2.5 -3 h5 Q4 -6 3 -12"/>
      <path d="M-2.2 -9 L2.2 -6"/>
      <path d="M-2.2 -6 L2.2 -9"/>
      <circle cx="16" cy="-12" r="3"/>
      <path d="M14.4 -13.4 Q15.2 -15.2 16.2 -13.6"/>
      <path d="M13.6 -11.2 Q16 -12.6 17.4 -11"/>
      <path d="M15.2 -10.2 Q15.6 -7 15.2 -6"/>
    </g>
    <text x="43" y="258" text-anchor="middle" font-size="3.15" font-weight="700">
      <tspan x="43" dy="0">Lucas se enoja y le dice:</tspan>
      <tspan x="43" dy="3.8">«¡Eres egoísta!</tspan>
      <tspan x="43" dy="3.8">¡Ya no eres mi amigo!»</tspan>
    </text>
  </g>

  <g>
    <rect x="77" y="214" width="56" height="66" rx="3.5" fill="#fff" stroke="#e67e22" stroke-width="2.4"/>
    <path d="M86 236 L124 274 M124 236 L86 274" fill="none" stroke="#c0392b" stroke-width="2.2" opacity="0.28"/>
    <text x="105" y="221" text-anchor="middle" font-size="4.2" font-weight="800">CAMINO B</text>
    <g class="ink" stroke-width="1.05" transform="translate(105 240)">
      <circle cx="-1" cy="-16" r="4.2"/>
      <path d="M-3.6 -18.5 Q-1 -22 2 -18.2"/>
      <circle cx="-2.4" cy="-16.2" r="0.5" fill="#111" stroke="none"/>
      <circle cx="0.4" cy="-16.2" r="0.5" fill="#111" stroke="none"/>
      <path d="M-2.4 -14 Q-1 -15.2 0.6 -14"/>
      <path d="M-0.2 -15.2 Q-0.6 -12.2 -1.2 -11"/>
      <path d="M-3.2 -12 Q-2 -5 0 -2"/>
      <path d="M-4 -8 L-8 -6"/>
      <path d="M0.2 -8 L4 -9"/>
      <path d="M-1.2 -2 L-4 5"/>
      <path d="M0.4 -2 L3 4"/>
      <path d="M-6.2 5 h4"/>
      <path d="M1.4 4 h4"/>
    </g>
    <text x="105" y="258" text-anchor="middle" font-size="3.15" font-weight="700">
      <tspan x="105" dy="0">Lucas se va triste</tspan>
      <tspan x="105" dy="3.8">pensando:</tspan>
      <tspan x="105" dy="3.8">«Nadie me quiere»</tspan>
    </text>
  </g>

  <g>
    <rect x="139" y="214" width="56" height="66" rx="3.5" fill="#fff" stroke="#1e8449" stroke-width="2.4"/>
    <path d="M148 258 L160 272 L186 236" fill="none" stroke="#1e8449" stroke-width="2.4" opacity="0.35"/>
    <text x="167" y="221" text-anchor="middle" font-size="4.2" font-weight="800">CAMINO C</text>
    <g class="ink" stroke-width="1.05" transform="translate(167 240)">
      <circle cx="-8" cy="-15" r="3.6"/>
      <path d="M-10.4 -17 Q-8 -20 -5.6 -17"/>
      <circle cx="-9.2" cy="-15.2" r="0.45" fill="#111" stroke="none"/>
      <circle cx="-6.8" cy="-15.2" r="0.45" fill="#111" stroke="none"/>
      <path d="M-9.2 -13.6 Q-8 -12.6 -6.8 -13.6"/>
      <path d="M-10 -11.6 Q-8 -6 -6 -4"/>
      <circle cx="8" cy="-15" r="3.6"/>
      <path d="M5.6 -17 Q8 -20 10.4 -17"/>
      <circle cx="6.8" cy="-15.2" r="0.45" fill="#111" stroke="none"/>
      <circle cx="9.2" cy="-15.2" r="0.45" fill="#111" stroke="none"/>
      <path d="M6.8 -13.6 Q8 -12.6 9.2 -13.6"/>
      <path d="M6 -11.6 Q8 -6 10 -4"/>
      <path d="M-4 -8 Q0 -6 4 -8"/>
    </g>
    <text x="167" y="256" text-anchor="middle" font-size="3.05" font-weight="700">
      <tspan x="167" dy="0">Lucas pregunta:</tspan>
      <tspan x="167" dy="3.5">«¿Estás bien? ¿Pasó algo?»</tspan>
      <tspan x="167" dy="3.5">Tomás le cuenta</tspan>
      <tspan x="167" dy="3.5">que está triste.</tspan>
    </text>
  </g>
</svg>
